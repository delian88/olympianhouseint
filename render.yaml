services:
  # ─── Single Unified Service (React Frontend + PHP API) ────────────────────
  - type: web
    name: ohi-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: APP_ENV
        value: production
