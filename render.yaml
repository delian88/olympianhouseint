services:
  # ─── 1. React Frontend (Static Site — Free & Fast) ──────────────────────────
  - type: web
    name: ohi-frontend
    runtime: static
    buildCommand: pnpm install && pnpm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ohi-backend
          property: url

  # ─── 2. PHP Backend API (Docker Web Service) ────────────────────────────────
  - type: web
    name: ohi-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: APP_ENV
        value: production
